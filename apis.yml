aid: branch-insurance
name: Branch
description: >-
  Branch is a Columbus, Ohio insurtech that bundles home and auto insurance
  (with optional umbrella coverage) and issues policies in seconds from just a
  name and address. The company operates as Branch Insurance Exchange, a
  reciprocal insurer, plus the managing General Branch Agency / Branch Financial,
  Inc. holding company, and originally targeted direct-to-consumer customers
  with a quote-and-bind flow that prefills rating data from public sources.
  Branch raised a $147M Series C at a $1.05B valuation in 2022 (Weatherford
  Capital, Acrew Capital, Anthemis, Cherry Creek Holdings, Greycroft, HSCM
  Bermuda, AmFam Ventures, others), partnered with SimpliSafe (home security
  bundle) and ADT, and runs an embedded "Quote to Bind" GraphQL API used by
  affinity partners (mortgage originators, lenders, aggregators) to embed home
  + auto quotes inside their own apps. The Quote to Bind v2 GraphQL API
  (https://docs.v2.api.ourbranch.com) exposes requestQuoteV2, recalculateQuoteV2,
  addCar, addDriver, requestBind, getOffer, enhancedGetOffer,
  getBoundPoliciesByOfferId, getPolicyDocuments, and getOfferPDF, plus optional
  webhook / SFTP / S3 postbacks for bind and document-signed events. Partners
  authenticate with an API key in the Authorization header and an x-affinity-code
  header when responsible for multiple agencies, and may either run the whole
  flow via the API or hand customers off to ourbranch.com / staff.ourbranch.com
  for customize / review / checkout / sign-documents steps. A staging endpoint
  at https://staging.v2.api.ourbranch.com mirrors production with shared test
  users and payment methods. Branch operates in roughly two dozen US states
  including Ohio, Texas, Illinois, Arizona, Missouri, and others, and emphasises
  community-discount pricing, a community pledge / giveback program, and B Corp
  certification (2023). There is no public OpenAPI specification — the API is
  GraphQL-only and the schema is browsable on Apollo Studio
  (studio.apollographql.com/public/Branch-Quote-to-Bind-Staging) with an API key.
